# memory-mcp stack for an arm64 host. Qdrant and an OpenAI-compatible LLM
# gateway are EXTERNAL services on their own existing docker networks —
# referenced here, not redeclared. Set QDRANT_NETWORK / AIGATE_NETWORK in
# .env to your own network names, and the `qdrant`/`aigate-litellm-1`
# hostnames used in AIGATE_BASE_URL/QDRANT_URL to your own container
# hostnames. No GPU device requests anywhere: embeddings and distillation
# are network calls out to your existing LLM gateway.

name: memory-mcp

services:
  qdrant:
    # Local vector store. The repo's spec assumed an existing Qdrant container;
    # monster has none, so it lives in this stack. Port stays unpublished: only
    # containers on the `memory` network (memory-mcp) and any network you join
    # can reach it.
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    # loopback-only: backup.sh snapshots the collection from the host. Never
    # reachable off this machine.
    ports:
      - "127.0.0.1:6333:6333"
    # 15k+ chunks land in one ingest run; Qdrant keeps a segment's RocksDB
    # files open per collection and the default 1024 nofile limit exhausts
    # under that load (seen on monster 30 Oct 2026: "Too many open files"
    # during the first full ingest).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [memory]

  memory-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: memory
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    # internal network only — the memory DB is not reachable from the
    # gateway/qdrant networks
    networks: [memory]

  memory-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://memory:${POSTGRES_PASSWORD}@memory-postgres:5432/memory
      # inside the compose network the server listens on all interfaces;
      # the WG-only property comes from the host port binding below
      LISTEN: 0.0.0.0:7105
    ports:
      # WG-only bind: LISTEN_HOST must be this host's WG interface address
      - "${LISTEN_HOST:-10.8.0.1}:7105:7105"
    volumes:
      - ${MEMORY_HOME:-/srv/memory}:${MEMORY_HOME:-/srv/memory}
    depends_on:
      memory-postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [memory, aigate_net]

networks:
  memory: {}
  aigate_net:
    # AIGATE_NETWORK: the docker network your existing LLM gateway runs on
    name: ${AIGATE_NETWORK:-aigate_default}
    external: true

volumes:
  memory-pgdata: {}
  qdrant-data: {}
