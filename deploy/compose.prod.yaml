# memory-mcp stack for an arm64 host. Qdrant and an OpenAI-compatible LLM
# gateway are EXTERNAL services on their own existing docker networks —
# referenced here, not redeclared. Replace the two `name:` fields below
# under `networks:` with your own network names, and `qdrant`/`aigate-litellm-1`
# hostnames in .env with your own container hostnames.
# No GPU device requests anywhere: embeddings and distillation are network
# calls out to your existing LLM gateway.

name: memory-mcp

services:
  memory-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: memory
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    # internal network only — the memory DB is not reachable from the
    # gateway/qdrant networks
    networks: [memory]

  memory-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://memory:${POSTGRES_PASSWORD}@memory-postgres:5432/memory
      # inside the compose network the server listens on all interfaces;
      # the WG-only property comes from the host port binding below
      LISTEN: 0.0.0.0:7105
    ports:
      # WG-only bind: LISTEN_HOST must be this host's WG interface address
      - "${LISTEN_HOST:-10.8.0.1}:7105:7105"
    volumes:
      - /srv/memory:/srv/memory
    depends_on:
      memory-postgres:
        condition: service_healthy
    networks: [memory, qdrant_net, aigate_net]

networks:
  memory: {}
  qdrant_net:
    # replace with the docker network your existing Qdrant container runs on
    name: qdrant_default
    external: true
  aigate_net:
    # replace with the docker network your existing LLM gateway runs on
    name: aigate_default
    external: true

volumes:
  memory-pgdata: {}
