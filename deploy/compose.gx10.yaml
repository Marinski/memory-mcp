# memory-mcp stack for the GX10 (aarch64). Qdrant and aigate are EXTERNAL
# services on their existing docker networks — referenced, not redeclared:
#   qdrant           -> network litellm-config_default (hostname 'qdrant')
#   aigate litellm   -> network aigate_aigate-public   (hostname 'aigate-litellm-1')
# No GPU device requests anywhere: embeddings and distillation are network
# calls to the aigate/vLLM stack.

name: memory-mcp

services:
  memory-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: memory
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 10s
      timeout: 5s
      retries: 5
    # internal network only — the memory DB is not reachable from the
    # aigate/qdrant networks
    networks: [memory]

  memory-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://memory:${POSTGRES_PASSWORD}@memory-postgres:5432/memory
      # inside the compose network the server listens on all interfaces;
      # the WG-only property comes from the host port binding below
      LISTEN: 0.0.0.0:7105
    ports:
      # WG-only bind: LISTEN_HOST is the GX10's WG address (10.8.0.x)
      - "${LISTEN_HOST:-10.8.0.1}:7105:7105"
    volumes:
      - /srv/memory:/srv/memory
    depends_on:
      memory-postgres:
        condition: service_healthy
    networks: [memory, qdrant_net, aigate_net]

networks:
  memory: {}
  qdrant_net:
    name: litellm-config_default
    external: true
  aigate_net:
    name: aigate_aigate-public
    external: true

volumes:
  memory-pgdata: {}
